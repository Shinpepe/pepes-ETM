<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 여행 공유 — 우리가 다녀온 세계</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --ink:#0b1220;          /* 밤하늘 */
    --panel:#111b2c;        /* 창가 */
    --panel-2:#182337;
    --line:rgba(242,236,223,.12);
    --amber:#ffb65c;        /* 도시의 불빛 */
    --amber-soft:rgba(255,182,92,.16);
    --teal:#59dcc9;         /* 내 발자국 */
    --paper:#f2ecdf;        /* 따뜻한 흰색 */
    --muted:rgba(242,236,223,.62);
    --shadow:0 18px 50px rgba(0,0,0,.45);
    --radius:16px;
    --display:'Gowun Batang', serif;
    --body:'Pretendard Variable', Pretendard, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body);
    background:var(--ink);
    color:var(--paper);
    overflow:hidden;
  }
  #map{position:fixed;inset:0;background:var(--ink);}
  .leaflet-container{background:var(--ink);font-family:var(--body);}

  /* ── 상단 바 ─────────────────────────── */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:14px;
    padding:14px 20px;
    background:linear-gradient(180deg, rgba(11,18,32,.92), rgba(11,18,32,0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:max-content;}
  .brand b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .brand span{font-size:11px;color:var(--muted);letter-spacing:.14em;}
  .searchwrap{position:relative;flex:1;max-width:420px;}
  .searchwrap input{
    width:100%;padding:11px 14px 11px 38px;
    border-radius:999px;border:1px solid var(--line);
    background:rgba(17,27,44,.85);backdrop-filter:blur(8px);
    color:var(--paper);font-size:14px;font-family:var(--body);
    outline:none;transition:border-color .15s;
  }
  .searchwrap input:focus{border-color:var(--amber)}
  .searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
  .suggest{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);display:none;max-height:280px;overflow-y:auto;
  }
  .suggest.open{display:block}
  .suggest button{
    display:flex;width:100%;align-items:center;justify-content:space-between;
    padding:10px 14px;background:none;border:none;color:var(--paper);
    font-size:14px;font-family:var(--body);cursor:pointer;text-align:left;
  }
  .suggest button:hover,.suggest button:focus-visible{background:var(--amber-soft)}
  .suggest small{color:var(--muted)}
  .spacer{flex:1}
  .userbox{display:flex;align-items:center;gap:10px;}
  .userbox .who{font-size:13px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btn{
    border:1px solid var(--line);border-radius:999px;
    padding:10px 18px;font-size:14px;font-weight:600;font-family:var(--body);
    background:rgba(17,27,44,.85);color:var(--paper);cursor:pointer;
    transition:transform .12s, background .15s, border-color .15s;
  }
  .btn:hover{transform:translateY(-1px);border-color:rgba(255,182,92,.5)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#231607;}
  .btn.primary:hover{background:#ffc678}
  .btn:focus-visible,.suggest button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ── 좌하단 통계 ─────────────────────── */
  .stats{
    position:fixed;left:20px;bottom:20px;z-index:900;
    background:rgba(17,27,44,.88);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;min-width:220px;box-shadow:var(--shadow);
  }
  .stats h2{font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:10px;}
  .stats .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted);}
  .stats .row b{color:var(--paper);font-variant-numeric:tabular-nums;}
  .legend{display:flex;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
  .dot.amber{background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .dot.teal{background:var(--teal);box-shadow:0 0 8px var(--teal);}
  .demo-badge{
    display:none;margin-top:10px;font-size:11px;color:var(--amber);
    background:var(--amber-soft);border-radius:8px;padding:6px 9px;line-height:1.5;
  }
  .demo-badge.on{display:block}

  /* ── 도시 패널 ───────────────────────── */
  .panel{
    position:fixed;top:0;right:0;bottom:0;z-index:1100;
    width:min(400px, 100%);
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;box-shadow:var(--shadow);
  }
  .panel.open{transform:translateX(0)}
  .panel-photo{position:relative;height:210px;background:var(--panel-2);flex-shrink:0;}
  .panel-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .panel-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,27,44,.15),rgba(17,27,44,.85) 92%);}
  .panel-photo .noimg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:52px;color:rgba(242,236,223,.18);
  }
  .panel-close{
    position:absolute;top:14px;right:14px;z-index:2;
    width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(11,18,32,.7);color:var(--paper);font-size:16px;
  }
  .panel-head{position:absolute;left:20px;right:20px;bottom:14px;z-index:2;}
  .panel-head .country{font-size:12px;letter-spacing:.18em;color:var(--amber);}
  .panel-head h2{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.01em;}
  .panel-body{padding:18px 20px 24px;overflow-y:auto;flex:1;}
  .visitline{
    display:flex;align-items:baseline;gap:8px;margin-bottom:14px;
    font-size:14px;color:var(--muted);
  }
  .visitline b{font-family:var(--display);font-size:26px;color:var(--amber);font-variant-numeric:tabular-nums;}
  .panel-body p.desc{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:18px;}
  .panel-body h3{
    font-size:12px;letter-spacing:.16em;color:var(--muted);
    margin:18px 0 10px;text-transform:uppercase;
  }
  .spots{list-style:none}
  .spots li{
    padding:11px 0;border-bottom:1px solid var(--line);
    font-size:14.5px;display:flex;gap:10px;align-items:baseline;
  }
  .spots li::before{content:'✦';color:var(--amber);font-size:11px;}
  .panel-actions{padding:0 20px 20px;flex-shrink:0;}
  .panel-actions .btn{width:100%;padding:13px;font-size:15px;}
  .panel-actions .btn.done{background:var(--teal);border-color:var(--teal);color:#062a25;}
  .wikinote{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;}

  /* ── 로그인 모달 ─────────────────────── */
  .overlay{
    position:fixed;inset:0;z-index:2000;background:rgba(5,9,17,.7);
    backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.open{display:flex}
  .modal{
    width:min(380px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:28px;box-shadow:var(--shadow);
  }
  .modal h2{font-family:var(--display);font-size:22px;margin-bottom:4px;}
  .modal .sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;}
  .modal input{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink);color:var(--paper);font-size:14px;font-family:var(--body);outline:none;
  }
  .modal input:focus{border-color:var(--amber)}
  .modal .btn{width:100%;margin-top:16px;padding:12px;}
  .modal .alt{margin-top:10px;background:transparent;}
  .modal .err{color:#ff8f8f;font-size:12.5px;margin-top:10px;min-height:16px;line-height:1.5;}
  .modal .switch{margin-top:14px;font-size:13px;color:var(--muted);text-align:center;}
  .modal .switch a{color:var(--amber);cursor:pointer;text-decoration:underline;}

  /* 토스트 */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--paper);color:#1b1408;padding:11px 20px;border-radius:999px;
    font-size:14px;font-weight:600;z-index:3000;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* 마커 라벨 */
  .city-tip{
    background:var(--panel)!important;color:var(--paper)!important;
    border:1px solid var(--line)!important;border-radius:8px!important;
    font-family:var(--body)!important;font-size:12.5px!important;
    box-shadow:var(--shadow)!important;padding:5px 10px!important;
  }
  .leaflet-tooltip-top.city-tip::before{border-top-color:var(--panel)!important;}

  @media (max-width:640px){
    .topbar{flex-wrap:wrap;padding:10px 12px;}
    .brand span{display:none}
    .searchwrap{order:3;min-width:100%;max-width:none;}
    .userbox .who{display:none}
    .stats{left:12px;bottom:12px;right:auto;padding:12px 14px;min-width:0;}
    .stats .row{font-size:12px}
    .panel{top:auto;height:78%;width:100%;border-left:none;border-top:1px solid var(--line);
      border-radius:20px 20px 0 0;transform:translateY(105%);}
    .panel.open{transform:translateY(0)}
    .panel-photo{height:160px;border-radius:20px 20px 0 0;overflow:hidden;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="세계 여행 지도"></div>

<header class="topbar">
  <div class="brand">
    <b>모두의 여행 공유</b>
    <span>EVERYONE'S TRAVEL MAP</span>
  </div>
  <div class="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2ecdf" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="도시를 검색해 발자국을 남겨보세요 (예: 파리)" autocomplete="off" aria-label="도시 검색" />
    <div class="suggest" id="suggest" role="listbox"></div>
  </div>
  <div class="spacer"></div>
  <div class="userbox" id="userbox">
    <button class="btn primary" id="loginBtn">로그인</button>
  </div>
</header>

<aside class="stats" aria-live="polite">
  <h2>지금까지의 발자국</h2>
  <div class="row"><span>기록된 여행</span><b id="statVisits">0</b></div>
  <div class="row"><span>불이 켜진 도시</span><b id="statCities">0</b></div>
  <div class="row"><span>내가 다녀온 도시</span><b id="statMine">–</b></div>
  <div class="legend">
    <span><i class="dot amber"></i>모두의 도시</span>
    <span><i class="dot teal"></i>나의 도시</span>
  </div>
  <div class="demo-badge" id="demoBadge">
    데모 모드로 실행 중입니다.<br/>index.html의 firebaseConfig를 채우면<br/>실제 데이터가 저장됩니다.
  </div>
</aside>

<!-- 도시 상세 패널 -->
<section class="panel" id="panel" aria-label="도시 정보">
  <div class="panel-photo" id="panelPhoto">
    <div class="noimg" id="panelNoimg">✈</div>
    <button class="panel-close" id="panelClose" aria-label="닫기">✕</button>
    <div class="panel-head">
      <div class="country" id="panelCountry"></div>
      <h2 id="panelCity"></h2>
    </div>
  </div>
  <div class="panel-body">
    <div class="visitline"><b id="panelCount">0</b><span>명의 여행자가 이곳에 다녀갔어요</span></div>
    <p class="desc" id="panelDesc"></p>
    <h3>주요 관광지</h3>
    <ul class="spots" id="panelSpots"></ul>
  </div>
  <div class="panel-actions">
    <button class="btn primary" id="visitBtn">🧳 나도 다녀왔어요</button>
    <div class="wikinote" id="wikiNote"></div>
  </div>
</section>

<!-- 로그인 모달 -->
<div class="overlay" id="authOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <h2 id="authTitle">여행자 로그인</h2>
    <p class="sub" id="authSub">발자국을 남기려면 로그인이 필요해요.</p>
    <div id="authFields">
      <label for="authEmail">이메일</label>
      <input id="authEmail" type="email" placeholder="you@example.com" />
      <label for="authPw">비밀번호</label>
      <input id="authPw" type="password" placeholder="6자 이상" />
    </div>
    <button class="btn primary" id="authSubmit">로그인</button>
    <div class="err" id="authErr"></div>
    <div class="switch" id="authSwitch">아직 계정이 없나요? <a id="authToggle">가입하기</a></div>
    <button class="btn alt" id="authCancel" style="margin-top:4px">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* ══════════════════════════════════════════════════════════════
   3) 데이터 계층 — Firebase 또는 데모(메모리)
══════════════════════════════════════════════════════════════ */
let fb = null;            // {auth, db, fns...}
let currentUser = null;   // {uid, name}
let visitCounts = {};     // cityId -> count
let myVisits = new Set(); // 내가 다녀온 cityId
let unsubVisits = null;

// ── 데모 모드 저장소 (메모리) ──
const demoSeed = {
  tokyo:41,osaka:38,paris:29,bangkok:27,danang:24,london:22,taipei:21,newyork:19,
  rome:17,barcelona:16,singapore:15,fukuoka:15,prague:13,cebu:12,hongkong:12,
  seoul:11,bali:11,sydney:9,honolulu:9,budapest:8,istanbul:7,interlaken:7,
  santorini:6,dubai:6,la:5,lisbon:5,venice:4,cusco:3,rio:3,cairo:2,marrakech:2,helsinki:2
};
let demoVisits = {...demoSeed};

async function initFirebase(){
  const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut},
         {getFirestore,collection,addDoc,onSnapshot,query,serverTimestamp}] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
  ]);
  const app = initializeApp(firebaseConfig);
  fb = {
    auth:getAuth(app), db:getFirestore(app),
    onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,
    collection,addDoc,onSnapshot,query,serverTimestamp
  };
  fb.onAuthStateChanged(fb.auth, u=>{
    currentUser = u ? {uid:u.uid, name:u.displayName || u.email} : null;
    renderUser(); subscribeVisits();
  });
  subscribeVisits();
}

function subscribeVisits(){
  if(DEMO){
    visitCounts = {...demoVisits};
    // 데모: 로그인한 유저의 방문은 myVisits 그대로 유지
    refreshAll(); return;
  }
  if(unsubVisits) unsubVisits();
  unsubVisits = fb.onSnapshot(fb.query(fb.collection(fb.db,"visits")), snap=>{
    visitCounts = {}; myVisits = new Set();
    snap.forEach(doc=>{
      const v = doc.data();
      if(!CITY_MAP[v.cityId]) return;
      visitCounts[v.cityId] = (visitCounts[v.cityId]||0)+1;
      if(currentUser && v.uid===currentUser.uid) myVisits.add(v.cityId);
    });
    refreshAll();
  }, err=>{
    console.error(err);
    toast("데이터를 불러오지 못했어요. Firestore 규칙을 확인해 주세요.");
  });
}

async function addVisit(cityId){
  if(!currentUser){ openAuth(); return; }
  if(myVisits.has(cityId)){ toast("이미 발자국을 남긴 도시예요 ✦"); return; }
  if(DEMO){
    demoVisits[cityId] = (demoVisits[cityId]||0)+1;
    myVisits.add(cityId);
    subscribeVisits();
  }else{
    try{
      await fb.addDoc(fb.collection(fb.db,"visits"),{
        uid:currentUser.uid, cityId, createdAt:fb.serverTimestamp()
      });
    }catch(e){ console.error(e); toast("저장에 실패했어요. 잠시 후 다시 시도해 주세요."); return; }
  }
  toast(`${CITY_MAP[cityId].n}에 발자국을 남겼어요 🧳`);
  openCity(cityId); // 패널 갱신
}

/* ══════════════════════════════════════════════════════════════
   4) 지도
══════════════════════════════════════════════════════════════ */
const map = L.map("map",{zoomControl:false, worldCopyJump:true, minZoom:2}).setView([25,40],2.4);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",{
  attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:"abcd", maxZoom:19
}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",{
  subdomains:"abcd", maxZoom:19, pane:"shadowPane"
}).addTo(map);

const markerLayer = L.layerGroup().addTo(map);
function radiusFor(count){ return count ? 6 + Math.sqrt(count)*2.6 : 4; }

function drawMarkers(){
  markerLayer.clearLayers();
  CITIES.forEach(city=>{
    const count = visitCounts[city.id]||0;
    const mine = myVisits.has(city.id);
    const m = L.circleMarker([city.lat,city.lng],{
      radius: radiusFor(count),
      color: mine ? "#59dcc9" : "#ffb65c",
      weight: mine ? 2.5 : 1.5,
      fillColor: "#ffb65c",
      fillOpacity: count ? 0.55 : 0.15,
      opacity: count ? 0.95 : 0.45,
    });
    m.bindTooltip(`${city.n} · ${count}명${mine?" · 나의 도시":""}`,
      {direction:"top", className:"city-tip", offset:[0,-4]});
    m.on("click",()=>openCity(city.id));
    m.addTo(markerLayer);
  });
}

/* ══════════════════════════════════════════════════════════════
   5) 도시 패널 + 위키피디아 사진
══════════════════════════════════════════════════════════════ */
const panel = document.getElementById("panel");
let openedCity = null;
const wikiCache = {};

async function openCity(id){
  const city = CITY_MAP[id]; if(!city) return;
  openedCity = id;
  document.getElementById("panelCity").textContent = city.n;
  document.getElementById("panelCountry").textContent = city.c;
  document.getElementById("panelCount").textContent = visitCounts[id]||0;
  document.getElementById("panelDesc").textContent = city.d;
  document.getElementById("panelSpots").innerHTML =
    city.s.map(s=>`<li>${s}</li>`).join("");
  const btn = document.getElementById("visitBtn");
  if(myVisits.has(id)){ btn.textContent = "✓ 다녀온 도시예요"; btn.className="btn done"; }
  else{ btn.textContent = "🧳 나도 다녀왔어요"; btn.className="btn primary"; }
  // 사진
  const photoBox = document.getElementById("panelPhoto");
  const noimg = document.getElementById("panelNoimg");
  const note = document.getElementById("wikiNote");
  photoBox.querySelector("img")?.remove(); noimg.style.display="flex"; note.textContent="";
  panel.classList.add("open");
  map.flyTo([city.lat,city.lng], Math.max(map.getZoom(),5), {duration:.8});
  try{
    if(!wikiCache[id]){
      const res = await fetch(`https://ko.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(city.w)}`);
      wikiCache[id] = res.ok ? await res.json() : {};
    }
    const w = wikiCache[id];
    if(openedCity!==id) return; // 다른 도시로 이동함
    if(w.thumbnail?.source){
      const img = document.createElement("img");
      img.src = w.originalimage?.source || w.thumbnail.source;
      img.alt = `${city.n} 대표 사진`;
      photoBox.prepend(img); noimg.style.display="none";
      note.textContent = "사진 · 설명 출처: 한국어 위키백과";
    }
    if(w.extract) document.getElementById("panelDesc").textContent = w.extract;
  }catch(e){ /* 사진 없이 진행 */ }
}
document.getElementById("panelClose").onclick = ()=>panel.classList.remove("open");
document.getElementById("visitBtn").onclick = ()=>openedCity && addVisit(openedCity);

/* ══════════════════════════════════════════════════════════════
   6) 검색
══════════════════════════════════════════════════════════════ */
const searchEl = document.getElementById("search");
const suggestEl = document.getElementById("suggest");
searchEl.addEventListener("input",()=>{
  const q = searchEl.value.trim();
  if(!q){ suggestEl.classList.remove("open"); return; }
  const hits = CITIES.filter(c=>c.n.includes(q)||c.c.includes(q)||c.id.includes(q.toLowerCase())).slice(0,8);
  if(!hits.length){ suggestEl.innerHTML = `<button disabled>검색 결과가 없어요</button>`; }
  else suggestEl.innerHTML = hits.map(c=>
    `<button data-id="${c.id}"><span>${c.n}</span><small>${c.c} · ${visitCounts[c.id]||0}명</small></button>`).join("");
  suggestEl.classList.add("open");
});
suggestEl.addEventListener("click",e=>{
  const id = e.target.closest("button")?.dataset.id;
  if(id){ openCity(id); suggestEl.classList.remove("open"); searchEl.value=""; }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".searchwrap")) suggestEl.classList.remove("open");
});

/* ══════════════════════════════════════════════════════════════
   7) 로그인 UI
══════════════════════════════════════════════════════════════ */
const overlay = document.getElementById("authOverlay");
let signupMode = false;
function openAuth(){ overlay.classList.add("open"); document.getElementById("authErr").textContent=""; }
function closeAuth(){ overlay.classList.remove("open"); }
document.getElementById("authCancel").onclick = closeAuth;
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeAuth(); });

document.getElementById("authToggle").onclick = ()=>{
  signupMode = !signupMode;
  document.getElementById("authTitle").textContent = signupMode?"여행자 가입":"여행자 로그인";
  document.getElementById("authSubmit").textContent = signupMode?"가입하기":"로그인";
  document.getElementById("authSwitch").firstChild.textContent =
    signupMode?"이미 계정이 있나요? ":"아직 계정이 없나요? ";
  document.getElementById("authToggle").textContent = signupMode?"로그인":"가입하기";
};

document.getElementById("authSubmit").onclick = async ()=>{
  const email = document.getElementById("authEmail").value.trim();
  const pw = document.getElementById("authPw").value;
  const err = document.getElementById("authErr");
  if(DEMO){
    if(!email){ err.textContent="이메일(또는 닉네임)을 입력해 주세요."; return; }
    currentUser = {uid:"demo-"+email, name:email};
    renderUser(); closeAuth(); toast(`${email}님, 즐거운 여행 되세요 ✈`);
    return;
  }
  try{
    if(signupMode) await fb.createUserWithEmailAndPassword(fb.auth,email,pw);
    else await fb.signInWithEmailAndPassword(fb.auth,email,pw);
    closeAuth();
  }catch(e){
    const msgs = {
      "auth/invalid-email":"이메일 형식이 올바르지 않아요.",
      "auth/weak-password":"비밀번호는 6자 이상이어야 해요.",
      "auth/email-already-in-use":"이미 가입된 이메일이에요. 로그인해 주세요.",
      "auth/invalid-credential":"이메일 또는 비밀번호가 맞지 않아요.",
      "auth/user-not-found":"등록되지 않은 이메일이에요.",
      "auth/wrong-password":"비밀번호가 맞지 않아요.",
    };
    err.textContent = msgs[e.code] || "로그인에 실패했어요. 잠시 후 다시 시도해 주세요.";
  }
};
function renderUser(){
  const box = document.getElementById("userbox");
  if(currentUser){
    box.innerHTML = `<span class="who">✈ ${currentUser.name}</span>
      <button class="btn" id="logoutBtn">로그아웃</button>`;
    document.getElementById("logoutBtn").onclick = async ()=>{
      if(DEMO){ currentUser=null; myVisits=new Set(); renderUser(); subscribeVisits(); }
      else await fb.signOut(fb.auth);
      toast("다음 여행에서 만나요!");
    };
  }else{
    box.innerHTML = `<button class="btn primary" id="loginBtn">로그인</button>`;
    document.getElementById("loginBtn").onclick = openAuth;
  }
  refreshAll();
}
document.getElementById("loginBtn").onclick = openAuth;

/* ══════════════════════════════════════════════════════════════
   8) 통계 · 토스트 · 초기화
══════════════════════════════════════════════════════════════ */
function refreshAll(){
  drawMarkers();
  const total = Object.values(visitCounts).reduce((a,b)=>a+b,0);
  document.getElementById("statVisits").textContent = total.toLocaleString();
  document.getElementById("statCities").textContent =
    Object.keys(visitCounts).filter(k=>visitCounts[k]>0).length;
  document.getElementById("statMine").textContent =
    currentUser ? myVisits.size : "–";
  if(openedCity) document.getElementById("panelCount").textContent = visitCounts[openedCity]||0;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

if(DEMO){
  document.getElementById("demoBadge").classList.add("on");
  visitCounts = {...demoVisits};
  refreshAll();
}else{
  initFirebase().catch(e=>{
    console.error(e);
    toast("Firebase 초기화에 실패했어요. 설정값을 확인해 주세요.");
  });
}
</script>
